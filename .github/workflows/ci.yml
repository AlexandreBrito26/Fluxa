name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test
        env:
          TZ: America/Sao_Paulo

      - name: Build (inclui checagem de tipos)
        run: npm run build
